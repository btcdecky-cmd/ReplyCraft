openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: message-builder
    description: AI-assisted conversation analysis and reply drafting
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /message-builder/generate:
    post:
      operationId: generateMessageReply
      tags: [message-builder]
      summary: Analyze a conversation and draft a reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageReplyInput"
      responses:
        "200":
          description: Conversation analysis and reply draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReplyDraft"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MessageReplyInput:
      type: object
      properties:
        conversation:
          type: string
          minLength: 1
          maxLength: 12000
        tone:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - conversation
        - tone
    MessageReplyDraft:
      type: object
      properties:
        recipient:
          type: ["string", "null"]
        relationship:
          type: ["string", "null"]
        context:
          type: string
        reply:
          type: string
      required:
        - recipient
        - relationship
        - context
        - reply

